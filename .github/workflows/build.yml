name: Build Overleaf Multi-Arch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Overleaf Community Edition version/tag (e.g. 6.3.0)'
        required: true
        default: '6.3.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/overleaf

jobs:
  # ------------------------------------------------------------
  # 1. Native x86_64 build
  # ------------------------------------------------------------
  build-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Overleaf Community Edition source
        uses: actions/checkout@v4
        with:
          repository: overleaf/overleaf
          ref: v${{ inputs.version }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Overleaf CE (amd64)
        run: |
          cd server-ce
          DOCKER_DEFAULT_PLATFORM=linux/amd64 make build-base
          DOCKER_DEFAULT_PLATFORM=linux/amd64 make build-community

      - name: Tag and push amd64 image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker tag sharelatex/sharelatex:latest ${IMAGE_LOWER}:${{ inputs.version }}-amd64
          docker push ${IMAGE_LOWER}:${{ inputs.version }}-amd64

  # ------------------------------------------------------------
  # 2. Native ARM64 build (uses GitHub-hosted ubuntu-24.04-arm runner)
  # ------------------------------------------------------------
  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Overleaf Community Edition source
        uses: actions/checkout@v4
        with:
          repository: overleaf/overleaf
          ref: v${{ inputs.version }}
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Overleaf CE (arm64 native)
        run: |
          cd server-ce
          DOCKER_DEFAULT_PLATFORM=linux/arm64 make build-base
          DOCKER_DEFAULT_PLATFORM=linux/arm64 make build-community

      - name: Tag and push arm64 image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker tag sharelatex/sharelatex:latest ${IMAGE_LOWER}:${{ inputs.version }}-arm64
          docker push ${IMAGE_LOWER}:${{ inputs.version }}-arm64

  # ------------------------------------------------------------
  # 3. Create and push multi-architecture manifest
  # ------------------------------------------------------------
  create-manifest:
    name: Create Multi-Arch Manifest
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ inputs.version }}"

          docker buildx imagetools create \
            --tag ${IMAGE_LOWER}:${VERSION} \
            --tag ${IMAGE_LOWER}:latest \
            ${IMAGE_LOWER}:${VERSION}-amd64 \
            ${IMAGE_LOWER}:${VERSION}-arm64

          echo "========================================================"
          echo "Multi-architecture image successfully pushed:"
          echo "Image: ${IMAGE_LOWER}:${VERSION}"
          echo "========================================================"

name: Build Overleaf Multi-Arch

on:
  schedule:
    # Runs daily at 06:00 UTC to automatically detect and build new Overleaf releases
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Overleaf Docker version tag (e.g. 6.3.0, or leave empty to auto-detect latest)'
        required: false
        default: ''
      git_ref:
        description: 'Git ref in overleaf/overleaf to build arm64 from (default: main)'
        required: false
        default: 'main'
      use_official_amd64:
        description: 'Reuse official sharelatex/sharelatex:<version> for amd64 (faster & 100% official)'
        type: boolean
        required: true
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/overleaf

jobs:
  # ------------------------------------------------------------
  # 0. Check upstream Overleaf releases and determine if build is needed
  # ------------------------------------------------------------
  check-version:
    name: Check Overleaf Releases
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      needs_build: ${{ steps.check.outputs.needs_build }}
      use_official_amd64: ${{ steps.check.outputs.use_official_amd64 }}
      git_ref: ${{ steps.check.outputs.git_ref }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect Latest Version and Check GHCR
        id: check
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          MANUAL_VERSION="${{ inputs.version }}"
          GIT_REF="${{ inputs.git_ref || 'main' }}"
          USE_OFFICIAL_AMD64="${{ inputs.use_official_amd64 != false }}"

          if [ -n "$MANUAL_VERSION" ]; then
            echo "Manual build requested for version: $MANUAL_VERSION"
            TARGET_VERSION="$MANUAL_VERSION"
            NEEDS_BUILD="true"
          else
            echo "Querying Docker Hub API for latest stable sharelatex/sharelatex tags..."
            LATEST_TAG=$(python3 -c "
import urllib.request, json, re

url = 'https://registry.hub.docker.com/v2/repositories/sharelatex/sharelatex/tags?page_size=100'
req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
try:
    data = json.loads(urllib.request.urlopen(req, timeout=15).read())
    semver_regex = re.compile(r'^[0-9]+\.[0-9]+\.[0-9]+$')
    valid = []
    for r in data.get('results', []):
        tag = r.get('name', '')
        if semver_regex.match(tag):
            parts = tuple(map(int, tag.split('.')))
            valid.append((parts, tag))
    valid.sort(reverse=True)
    if valid:
        print(valid[0][1])
except Exception as e:
    print('')
")
            if [ -z "$LATEST_TAG" ]; then
              echo "::error::Failed to query latest version from Docker Hub"
              exit 1
            fi

            echo "Latest upstream Overleaf version: $LATEST_TAG"
            TARGET_VERSION="$LATEST_TAG"

            echo "Checking if $IMAGE_LOWER:$TARGET_VERSION already exists with both amd64 and arm64..."
            INSPECT_OUTPUT=$(docker buildx imagetools inspect "${IMAGE_LOWER}:${TARGET_VERSION}" 2>/dev/null || true)

            if echo "$INSPECT_OUTPUT" | grep -q "linux/amd64" && echo "$INSPECT_OUTPUT" | grep -q "linux/arm64"; then
              echo "✅ Version $TARGET_VERSION is already built and published with multi-arch (amd64 & arm64)."
              echo "No build required."
              NEEDS_BUILD="false"
            else
              echo "🚀 New version or incomplete image detected ($TARGET_VERSION). Triggering build!"
              NEEDS_BUILD="true"
            fi
          fi

          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "needs_build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"
          echo "use_official_amd64=$USE_OFFICIAL_AMD64" >> "$GITHUB_OUTPUT"
          echo "git_ref=$GIT_REF" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------
  # 1. Prepare linux/amd64
  # ------------------------------------------------------------
  build-amd64:
    name: Build linux/amd64
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull official Overleaf image (amd64)
        if: ${{ needs.check-version.outputs.use_official_amd64 == 'true' }}
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ needs.check-version.outputs.version }}"
          echo "Pulling official sharelatex/sharelatex:${VERSION} for linux/amd64..."
          docker pull --platform linux/amd64 sharelatex/sharelatex:${VERSION}
          docker tag sharelatex/sharelatex:${VERSION} ${IMAGE_LOWER}:${VERSION}-amd64
          docker push ${IMAGE_LOWER}:${VERSION}-amd64

      - name: Checkout Overleaf source (build from source)
        if: ${{ needs.check-version.outputs.use_official_amd64 != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: overleaf/overleaf
          ref: ${{ needs.check-version.outputs.git_ref }}

      - name: Set up Docker Buildx (build from source)
        if: ${{ needs.check-version.outputs.use_official_amd64 != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build Overleaf CE amd64 from source
        if: ${{ needs.check-version.outputs.use_official_amd64 != 'true' }}
        run: |
          cd server-ce
          export OVERLEAF_BASE_TAG="sharelatex/sharelatex-base:build-amd64"
          export OVERLEAF_BRANCH="sharelatex/sharelatex:build-amd64"
          export OVERLEAF_TAG="sharelatex/sharelatex:build-amd64"
          DOCKER_DEFAULT_PLATFORM=linux/amd64 make build-base
          DOCKER_DEFAULT_PLATFORM=linux/amd64 make build-community

          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ needs.check-version.outputs.version }}"
          docker tag sharelatex/sharelatex:build-amd64 ${IMAGE_LOWER}:${VERSION}-amd64
          docker push ${IMAGE_LOWER}:${VERSION}-amd64

  # ------------------------------------------------------------
  # 2. Native ARM64 build (uses GitHub-hosted ubuntu-24.04-arm runner)
  # ------------------------------------------------------------
  build-arm64:
    name: Build linux/arm64
    needs: check-version
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Overleaf Community Edition source
        uses: actions/checkout@v4
        with:
          repository: overleaf/overleaf
          ref: ${{ needs.check-version.outputs.git_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Overleaf CE (arm64 native)
        run: |
          cd server-ce
          export OVERLEAF_BASE_TAG="sharelatex/sharelatex-base:build-arm64"
          export OVERLEAF_BRANCH="sharelatex/sharelatex:build-arm64"
          export OVERLEAF_TAG="sharelatex/sharelatex:build-arm64"
          DOCKER_DEFAULT_PLATFORM=linux/arm64 make build-base
          DOCKER_DEFAULT_PLATFORM=linux/arm64 make build-community

      - name: Tag and push arm64 image
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ needs.check-version.outputs.version }}"
          docker tag sharelatex/sharelatex:build-arm64 ${IMAGE_LOWER}:${VERSION}-arm64
          docker push ${IMAGE_LOWER}:${VERSION}-arm64

  # ------------------------------------------------------------
  # 3. Create and push multi-architecture manifest
  # ------------------------------------------------------------
  create-manifest:
    name: Create Multi-Arch Manifest
    needs: [check-version, build-amd64, build-arm64]
    if: needs.check-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ needs.check-version.outputs.version }}"

          docker buildx imagetools create \
            --tag ${IMAGE_LOWER}:${VERSION} \
            --tag ${IMAGE_LOWER}:latest \
            ${IMAGE_LOWER}:${VERSION}-amd64 \
            ${IMAGE_LOWER}:${VERSION}-arm64

          echo "========================================================"
          echo "Multi-architecture image successfully pushed:"
          echo "Image: ${IMAGE_LOWER}:${VERSION}"
          echo "========================================================"

